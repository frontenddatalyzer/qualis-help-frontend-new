<ul class="tree-list">
  @for (node of data; track node.id) {
    <li>
      <div class="tree-item">
        <!-- Folder -->
        @if (isFolder(node)) {
          <span class="folder-icon" (click)="toggleFolder(node)">
            <span [ngClass]="node.expanded ? 'dl-folder-open' : 'dl-folder-close'"></span>
          </span>
          <span (click)="toggleFolder(node)">{{ node.text }}</span>
        }

        <!-- Document -->
        @if (isDocument(node)) {
          <span class="doc-icon">
            <span class="dl-document"></span>
          </span>
          <a [class.selected]="node.id === selectedId"
             [routerLink]="['/products', productSlug, node.id]">
            <span>{{ node.text }}</span>
          </a>
        }
      </div>

      <!-- Recursive tree for children -->
      @if (isFolder(node) && node.expanded) {
        <app-hierarchy
          [data]="node.children"
          [productSlug]="productSlug">
        </app-hierarchy>
      }
    </li>
  }
</ul>
